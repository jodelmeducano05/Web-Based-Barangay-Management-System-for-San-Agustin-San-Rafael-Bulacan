name: Web-Based Barangay Management System CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo, pdo_mysql, mysqli
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --strict || echo "No composer.json found, skipping"

      - name: Install PHP dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-progress --prefer-dist --optimize-autoloader
          fi

      - name: Check PHP syntax
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | grep -v "No syntax errors"

      - name: Deploy message
        run: echo "Build successful - Ready for deployment to San Agustin Server"
